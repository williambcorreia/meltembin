name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build meltembin
        run: |
          cc meltembin.c functions.c -o meltembin

      - name: Build meltemgui
        working-directory: gui
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --add-binary "../meltembin:." \
            meltemgui.py

      - name: Prepare release files
        run: |
          mkdir release
          cp meltembin release/meltembin-linux-x86_64
          cp gui/dist/meltemgui release/meltemgui-linux-x86_64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build meltembin
        shell: msys2 {0}
        run: |
          gcc meltembin.c functions.c -o meltembin

      - name: Build meltemgui
        working-directory: gui
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --add-binary "../meltembin;." `
            meltemgui.py

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item gui/dist/meltemgui.exe release/meltemgui-windows-x86_64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/


  release:
    name: Create Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Create source archives
        run: |
          git archive \
            --format=tar.gz \
            --prefix=meltembin-${GITHUB_REF_NAME}/ \
            "${GITHUB_REF_NAME}" \
            > "release/meltembin-${GITHUB_REF_NAME}-source.tar.gz"

          git archive \
            --format=zip \
            --prefix=meltembin-${GITHUB_REF_NAME}/ \
            "${GITHUB_REF_NAME}" \
            > "release/meltembin-${GITHUB_REF_NAME}-source.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
